<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSketch - Neural Network Mesh</title>  
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <div class="header">
        <!-- <img src="medias/logo.png" alt="NeuroSketch Logo" class="logo"> -->
        <h1>NeuroSketch - Neural Network Mesh</h1>
    </div>

    <div class="container">
        <!-- Sidebar with Controls -->
        <div class="sidebar">
            <div class="sidebar-title">🧠 Network Layers</div>
            
            <div class="layer-template" data-type="input">
                <div class="template-icon">📥</div>
                <div class="template-name">Input</div>
                <div class="template-neurons">784 neurons</div>
            </div>

            <div class="layer-template" data-type="dense">
                <div class="template-icon">⚫</div>
                <div class="template-name">Dense</div>
                <div class="template-neurons">128 neurons</div>
            </div>

            <div class="layer-template" data-type="relu">
                <div class="template-icon">⚡</div>
                <div class="template-name">ReLU</div>
                <div class="template-neurons">Activation</div>
            </div>

            <div class="layer-template" data-type="conv">
                <div class="template-icon">🔲</div>
                <div class="template-name">Conv2D</div>
                <div class="template-neurons">32 filters</div>
            </div>

            <div class="layer-template" data-type="pool">
                <div class="template-icon">📦</div>
                <div class="template-name">MaxPool</div>
                <div class="template-neurons">Pooling</div>
            </div>

            <div class="layer-template" data-type="output">
                <div class="template-icon">📤</div>
                <div class="template-name">Output</div>
                <div class="template-neurons">10 neurons</div>
            </div>

            <div class="sidebar-divider"></div>
            
            <!-- Layer Info Panel -->
            <div id="layerInfoPanel" class="layer-info-panel" style="display:none;">
                <h3 id="layerInfoTitle">Layer Info</h3>
                <div id="layerInfoContent"></div>
            </div>

            <div class="sidebar-divider"></div>
            
            <button class="btn-clear" onclick="clearWorkspace()">🗑️ Clear</button>
            <button class="btn-train" onclick="trainNetwork()">🚀 Train</button>
        </div>

        <!-- Network Canvas -->
        <div class="workspace" id="workspace">
            <canvas id="networkCanvas"></canvas>
            <div class="canvas-hint" id="canvasHint">
                <div class="hint-text">Click on layers to add them • Click nodes to modify</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
